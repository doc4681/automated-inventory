name: Auto Sync Inventory

on:
  schedule:
    - cron: "0 6 */2 * *"   # ogni 2 giorni alle 06:00 UTC
  workflow_dispatch:          # trigger manuale da GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      MCWS_USERNAME: ${{ secrets.MCWS_USERNAME }}
      MCWS_PASSWORD: ${{ secrets.MCWS_PASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: Run pipeline
        run: xvfb-run --auto-servernum python3 pipeline.py

      - name: Commit and push updated CSVs
        run: |
          git config user.name  "${{ secrets.GIT_USER_NAME }}"
          git config user.email "${{ secrets.GIT_USER_EMAIL }}"
          git add scraper/carmodel_scraped.csv \
                  downloader/mcws_inventory.csv \
                  merger/merged_products.csv
          git diff --cached --quiet || git commit -m "chore: auto-sync inventory $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
